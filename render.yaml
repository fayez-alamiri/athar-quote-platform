services:
  - type: web
    name: athar
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: ATHAR
      - key: BRAND_NAME_AR
        value: "أَثَر"
      - key: BRAND_NAME_EN
        value: ATHAR
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: APP_KEY
        sync: false
      - key: DB_URL
        sync: false